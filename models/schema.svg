<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1220" viewBox="0 0 1080 1220">
<rect width="1080" height="1220" fill="#f4f7fb"/>
<style>text{font-family:Arial,sans-serif;fill:#17243a} .name{font-size:21px;font-weight:bold}.field{font-family:monospace;font-size:15px}.label{font-size:14px;fill:#275d91}.line{fill:none;stroke:#5e82a7;stroke-width:2}</style>
<text x="50" y="45" font-size="26" font-weight="bold">Фриланс-биржа · схема PostgreSQL</text>
<text x="50" y="74" font-size="15">PK — первичный ключ, FK — внешний ключ · значения 0..N и 0..1 обозначают кратность</text><rect x="330" y="110" width="420" height="137" rx="10" fill="white" stroke="#c4d3e2"/><rect x="330" y="110" width="420" height="44" rx="10" fill="#e0edfa"/><text class="name" x="346" y="139">users</text><text class="field" x="346" y="178">id PK · bigint</text><text class="field" x="346" y="203">name · text</text><text class="field" x="346" y="228">registered_at · timestamp</text><rect x="50" y="335" width="400" height="87" rx="10" fill="white" stroke="#c4d3e2"/><rect x="50" y="335" width="400" height="44" rx="10" fill="#e0edfa"/><text class="name" x="66" y="364">customers</text><text class="field" x="66" y="403">user_id PK, FK → users.id</text><rect x="620" y="335" width="410" height="137" rx="10" fill="white" stroke="#c4d3e2"/><rect x="620" y="335" width="410" height="44" rx="10" fill="#e0edfa"/><text class="name" x="636" y="364">freelancers</text><text class="field" x="636" y="403">user_id PK, FK → users.id</text><text class="field" x="636" y="428">specialization · text</text><text class="field" x="636" y="453">hourly_rate · numeric(12,2)</text><rect x="50" y="575" width="440" height="237" rx="10" fill="white" stroke="#c4d3e2"/><rect x="50" y="575" width="440" height="44" rx="10" fill="#e0edfa"/><text class="name" x="66" y="604">projects</text><text class="field" x="66" y="643">id PK · bigint</text><text class="field" x="66" y="668">customer_id FK → customers.user_id</text><text class="field" x="66" y="693">title, description · text</text><text class="field" x="66" y="718">budget · numeric(14,2)</text><text class="field" x="66" y="743">status · text</text><text class="field" x="66" y="768">created_at · timestamp</text><text class="field" x="66" y="793">completed_at · timestamp / NULL</text><rect x="620" y="575" width="410" height="287" rx="10" fill="white" stroke="#c4d3e2"/><rect x="620" y="575" width="410" height="44" rx="10" fill="#e0edfa"/><text class="name" x="636" y="604">bids</text><text class="field" x="636" y="643">id PK · bigint</text><text class="field" x="636" y="668">project_id FK → projects.id</text><text class="field" x="636" y="693">freelancer_id FK → freelancers.user_id</text><text class="field" x="636" y="718">amount · numeric(14,2)</text><text class="field" x="636" y="743">proposed_completion_date · date</text><text class="field" x="636" y="768">status · text</text><text class="field" x="636" y="793">submitted_at · timestamp</text><text class="field" x="636" y="818">accepted_at · timestamp / NULL</text><text class="field" x="636" y="843">rejected_at · timestamp / NULL</text><rect x="50" y="940" width="440" height="162" rx="10" fill="white" stroke="#c4d3e2"/><rect x="50" y="940" width="440" height="44" rx="10" fill="#e0edfa"/><text class="name" x="66" y="969">reviews</text><text class="field" x="66" y="1008">project_id PK, FK → projects.id</text><text class="field" x="66" y="1033">rating · smallint [1..5]</text><text class="field" x="66" y="1058">comment · text</text><text class="field" x="66" y="1083">created_at · timestamp</text><path class="line" d="M 400 247 V 288 H 250 V 335"/><text class="label" x="72" y="279">users 1 → customers 0..1</text><path class="line" d="M 680 247 V 288 H 825 V 335"/><text class="label" x="712" y="279">users 1 → freelancers 0..1</text><path class="line" d="M 250 422 V 575"/><text class="label" x="65" y="510">customers 1 → projects 0..N</text><path class="line" d="M 825 472 V 575"/><text class="label" x="646" y="528">freelancers 1 → bids 0..N</text><path class="line" d="M 490 700 H 620"/><text class="label" x="501" y="673">1 → 0..N</text><path class="line" d="M 250 812 V 940"/><text class="label" x="63" y="900">projects 1 → reviews 0..1</text><text x="620" y="965" font-size="16" font-weight="bold">Ограничения заявок</text><text x="620" y="995" font-size="15">UNIQUE(project_id, freelancer_id)</text><text x="620" y="1021" font-size="15">≤ 1 принятой заявки на проект</text><text x="620" y="1047" font-size="15">Суммы и ставки строго &gt; 0</text><text x="620" y="1073" font-size="15">Отзыв — только после завершения</text><text x="620" y="1099" font-size="15">Автор и получатель отзыва</text><text x="620" y="1125" font-size="15">определяются через проект и заявку.</text></svg>