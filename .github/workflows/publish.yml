name: Test and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sqltrainee:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check startup, queries and notebooks
        run: |
          docker run -d --name sqltrainee-test -v sqltrainee-test-data:/var/lib/sqltrainee sqltrainee:test
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' sqltrainee-test)
            [ "$state" = healthy ] && break
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' sqltrainee-test)" = healthy
          docker exec sqltrainee-test python /opt/sqltrainee/docker/runtime.py test
          docker exec --user learner sqltrainee-test sh -c 'echo persistence > /var/lib/sqltrainee/work/answers/probe.txt'
          docker stop -t 30 sqltrainee-test
          docker rm sqltrainee-test
          docker run -d --name sqltrainee-test -v sqltrainee-test-data:/var/lib/sqltrainee sqltrainee:test
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sqltrainee-test)" = healthy ] && break
            sleep 3
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' sqltrainee-test)" = healthy
          test "$(docker exec sqltrainee-test cat /var/lib/sqltrainee/work/answers/probe.txt)" = persistence
      - name: Container logs
        if: failure()
        run: docker logs sqltrainee-test
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Publish Intel/AMD + Apple Silicon images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
